name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ESLint
        run: npm install eslint@8 --no-save

      - name: Run ESLint
        run: npx eslint *.js  # warnings allowed, errors fail

      - name: Validate manifest.json
        run: |
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));

            // Required fields
            const required = ['manifest_version', 'name', 'version'];
            for (const field of required) {
              if (!manifest[field]) {
                console.error('Missing required field: ' + field);
                process.exit(1);
              }
            }

            // MV3 validation
            if (manifest.manifest_version !== 3) {
              console.error('Expected manifest_version 3, got ' + manifest.manifest_version);
              process.exit(1);
            }

            // Version format (semver)
            if (!/^\d+\.\d+\.\d+$/.test(manifest.version)) {
              console.error('Invalid version format: ' + manifest.version);
              process.exit(1);
            }

            console.log('✓ manifest.json valid (v' + manifest.version + ')');
          "

      - name: Security audit - permissions
        run: |
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));

            const dangerous = ['debugger', 'nativeMessaging', 'proxy'];
            const permissions = manifest.permissions || [];

            const found = permissions.filter(p => dangerous.includes(p));
            if (found.length > 0) {
              console.warn('⚠ Dangerous permissions: ' + found.join(', '));
            }

            if (manifest.host_permissions?.includes('<all_urls>')) {
              console.warn('⚠ host_permissions includes <all_urls>');
            }

            console.log('Permissions: ' + permissions.join(', '));
          "

  build:
    name: Build Extension
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Create extension zip
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          zip -r "Rox-Discovery-v${VERSION}.zip" \
            manifest.json \
            shared-defaults.json \
            prompt-defaults.js \
            background.js \
            content.js \
            content.css \
            workspace-map.js \
            workspace-map.css \
            fonts/ \
            popup.html \
            popup.js \
            options.html \
            options.js \
            icons/ \
            rules/ \
            -x "*.DS_Store" -x "__MACOSX/*"
          echo "Built Rox-Discovery-v${VERSION}.zip"
          ls -la *.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-build
          path: "*.zip"
          retention-days: 30
