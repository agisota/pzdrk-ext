<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Test Translation</title>
</head>
<body>
  <h1>Test Translation</h1>
  <p>Open Chrome DevTools (F12) → Console to see logs</p>
  <script>
    console.log('Testing translation function...');

    async function testTranslate() {
      const systemPrompt = 'Ты — профессиональный переводчик. Переведи текст на русский.';
      const userPrompt = 'Переведи следующий текст:\n\nHello, how are you?';

      const response = await chrome.runtime.sendMessage({
        action: 'callGroq',
        prompt: userPrompt,
        systemPrompt: systemPrompt,
        options: { temperature: 0.2, max_tokens: 6000 }
      });

      console.log('Test response:', response);
      return response;
    }

    testTranslate().then(r => console.log('Success:', r))
                      .catch(e => console.error('Error:', e));
  </script>
</body>
</html>
