<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rox Discovery</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 360px;
      min-height: 400px;
      font-family: 'SF Pro Display', 'SF Pro Text', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #e0e0e0;
      padding: 20px;
    }
    
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    
    .logo {
      width: 64px;
      height: 64px;
      object-fit: contain;
      margin: 0 auto 8px;
    }
    
    .title {
      font-size: 20px;
      font-weight: 600;
      background: linear-gradient(90deg, #00d4ff, #7b2cbf);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .subtitle {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }
    
    .status-bar {
      display: flex;
      justify-content: space-between;
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      margin-bottom: 20px;
    }
    
    .status-item {
      text-align: center;
    }
    
    .status-value {
      font-size: 18px;
      font-weight: 600;
      color: #00d4ff;
    }
    
    .status-label {
      font-size: 10px;
      color: #888;
      text-transform: uppercase;
    }
    
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }
    .error-message {
      margin: -8px 0 20px;
      color: #fca5a5;
      font-size: 12px;
      line-height: 1.4;
    }
    
    .btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #e0e0e0;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(0, 212, 255, 0.3);
    }
    
    .btn.primary {
      background: linear-gradient(90deg, rgba(0, 212, 255, 0.2), rgba(123, 44, 191, 0.2));
      border-color: rgba(0, 212, 255, 0.3);
    }
    
    .btn-icon {
      font-size: 20px;
    }
    
    .providers {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      padding: 16px;
    }
    
    .providers-title {
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    
    .provider-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .provider-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
      font-size: 12px;
    }
    
    .provider-name {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .provider-status {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    
    .provider-status.healthy {
      background: #4ade80;
      box-shadow: 0 0 8px #4ade80;
    }
    
    .provider-status.degraded {
      background: #fbbf24;
      box-shadow: 0 0 8px #fbbf24;
    }
    
    .provider-status.down {
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
    }
    
    .footer {
      margin-top: 20px;
      text-align: center;
    }
    
    .settings-link {
      color: #888;
      font-size: 12px;
      text-decoration: none;
      transition: color 0.2s;
    }
    
    .settings-link:hover {
      color: #00d4ff;
    }
    
    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(0, 212, 255, 0.3);
      border-top-color: #00d4ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script type="module" crossorigin src="/assets/popup-ByR5d71X.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/assets/index-oRFwxoj_.js">
</head>
<body>
  <div class="header">
    <img class="logo" src="/assets/pzdrk-LpuM--fs.png" alt="">
    <div class="title">Rox Discovery</div>
    <div class="subtitle">AI Analysis • Vector DB • Multi-Provider</div>
  </div>
  
  <div class="status-bar">
    <div class="status-item">
      <div class="status-value" id="summaries-count">0</div>
      <div class="status-label">Summaries</div>
    </div>
    <div class="status-item">
      <div class="status-value" id="hub-status">●</div>
      <div class="status-label">Hub</div>
    </div>
    <div class="status-item">
      <div class="status-value" id="milvus-status">●</div>
      <div class="status-label">Milvus</div>
    </div>
  </div>
  
  <div class="actions">
    <button class="btn primary" id="summarize-btn">
      <span class="btn-icon">✦</span>
      <span>Summarize Page</span>
    </button>
    <button class="btn" id="translate-btn">
      <span class="btn-icon">🌐</span>
      <span>Translate Page</span>
    </button>
    <button class="btn" id="mindmap-btn">
      <span class="btn-icon">🗺</span>
      <span>Generate Mindmap</span>
    </button>
  </div>
  <div id="summary-error" class="error-message" role="alert" hidden></div>
  
  <div class="providers">
    <div class="providers-title">Providers</div>
    <div class="provider-list" id="providers-list">
      <!-- Populated by JS -->
    </div>
  </div>
  
  <div class="footer">
    <a href="#" class="settings-link" id="settings-link">Open Settings →</a>
  </div>
  
</body>
</html>
